behaviors:
  MoveToGoal:
    trainer_type: ppo   # GAIL работает поверх PPO

    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 0.003
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 0.6
      gail:
        strength: 0.4
        gamma: 0.99
        demo_path: Demonstrations/traverseDemo1.demo
        use_actions: true
        use_vail: false


    keep_checkpoints: 5
    max_steps: 4000000
    time_horizon: 256
    summary_freq: 10000
