behaviors:
  Agent_GAIL:
    trainer_type: ppo   # GAIL работает поверх PPO
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0
      beta: 0.003
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 0.6
      gail:
        strength: 0.4
        gamma: 0.99
        demo_path: Demonstrations/traverseDemo1.demo
        use_actions: true
        use_vail: false
    keep_checkpoints: 5
    max_steps: 1000000
    time_horizon: 256
    summary_freq: 10000

  Agent_PPO_Tuned:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 15360
      learning_rate: 0.0
      beta: 0.0005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 500000
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          goal_conditioning_type: hyper
          deterministic: false
    keep_checkpoints: 5
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000

  Agent_PPO:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0
      beta: 0.001
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000

  Agent_BC:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0
      beta: 0.001
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      demo_path: Demonstrations/traverseDemo1.demo
      strength: 0.35
      steps: 300000
    keep_checkpoints: 5
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000


