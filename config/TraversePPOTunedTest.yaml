behaviors:
  Agent_PPO_Tuned:             
    trainer_type: ppo
    hyperparameters:    
      batch_size: 2048        
      buffer_size: 15360      
      learning_rate: 0.0   
      beta: 0.0005            
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear

    checkpoint_interval: 500000

    network_settings:   
      normalize: true         
      hidden_units: 256       
      num_layers: 2
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false

    reward_signals: 
      extrinsic:    
        gamma: 0.995          
        strength: 1.0
        network_settings:   
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false

    init_path: null
    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 1000000      
    time_horizon: 128        
    summary_freq: 10000       
    threaded: false
    self_play: null
    behavioral_cloning: null
