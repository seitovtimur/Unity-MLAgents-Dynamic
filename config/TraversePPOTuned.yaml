behaviors:
  MoveToGoal:             # ← имя должно совпадать с Behavior Name в Unity
    trainer_type: ppo
    hyperparameters:    
      batch_size: 2048        # ↑ больше batch → меньше градиентного шума
      buffer_size: 15360      
      learning_rate: 0.0003   # оставляем прежним
      beta: 0.0005            # чуть меньше энтропии, чтобы политика быстрее стабилизировалась
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear

    checkpoint_interval: 500000

    network_settings:   
      normalize: true         # нормализация наблюдений включена
      hidden_units: 256       # можно увеличить скрытые слои для большего разнообразия уровней
      num_layers: 2
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false

    reward_signals: 
      extrinsic:    
        gamma: 0.995          # чуть больше γ → агент «видит» дальние награды, полезно для длинных уровней
        strength: 1.0
        network_settings:   
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false

    init_path: null
    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 1000000       # ← увеличил до миллиона (у тебя было 100000)
    time_horizon: 128        # можно попробовать 256 если эпизоды длинные (>500 шагов)
    summary_freq: 3000       # чаще логгинг (примерно в 3 раза чаще, как ты и хотел)
    threaded: false
    self_play: null
    behavioral_cloning: null
