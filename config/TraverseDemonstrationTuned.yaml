behaviors:
  MoveToGoal:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048           # ↑ больше batch => стабильнее градиенты
      buffer_size: 20480         # буфер тоже увеличиваем пропорционально batch
      learning_rate: 3.0e-4
      beta: 0.005               # ↓ меньше энтропии => меньше хаотичных действий
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256          # ↑ увеличиваем нейросеть, чтобы «вместила» демонстрации плюс RL
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.995             # ↑ агент лучше ценит дальнюю награду
        strength: 1.0

    behavioral_cloning:
      demo_path: Demonstrations/traverseDemo.demo
      strength: 0.65              # ↓ снизил, чтобы агент не завис на демонстрации и начал переисследование
      steps: 300000              # ↑ растягиваем BC дольше, но не на всё обучение — чтобы не «залип»

    keep_checkpoints: 5
    max_steps: 4000000           # ✅ столько же, как и PPO Tuned — для сравнения
    time_horizon: 128
    summary_freq: 10000           # ✅ графики будут плотнее и детальнее, как ты хотел
