behaviors:
  MoveToGoal_Continuous:
    trainer_type: sac

    hyperparameters:
      # SAC работает с гораздо большим буфером, чем PPO
      batch_size: 1024
      buffer_size: 200000
      learning_rate: 3.0e-4
      tau: 0.005
      steps_per_update: 1
      learning_rate_schedule: constant

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 1_000_000
    time_horizon: 64
    summary_freq: 10000

    keep_checkpoints: 10
